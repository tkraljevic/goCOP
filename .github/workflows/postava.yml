# goCOP Postava i instalacijski program za Windows: na oznaku postava-v*
# (npr. postava-v1.0.0). Rijetko: Postava se mijenja samo kad treba
# (docs/plan-instalacija.md), a instalacijski program uvijek preuzme
# najnovije izdanje goCOP-a. Rezultat je nacrt izdanja; objavljuje se ručno.
name: Postava

on:
  push:
    tags: ["postava-v*"]
  # proba gradnje s grane, bez izdanja: rezultat je artefakt radnje
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provjera:
    uses: ./.github/workflows/provjera.yml

  postava:
    needs: provjera
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          check-latest: true

      - name: Izdanje iz oznake
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "IZDANJE=${GITHUB_REF_NAME#postava-v}" >> "$GITHUB_ENV"
          else
            echo "IZDANJE=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Resursi (ikona, izdanje, manifest) i ikona instalacijskog programa
        shell: bash
        working-directory: build/resursi
        run: go run . -program postava -izdanje "$IZDANJE" -izlaz ../../cmd/gocop-postava/rsrc_windows_amd64.syso -ico ../gocop.ico

      - name: Postava
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -H=windowsgui -X main.verzija=${IZDANJE}" -o dist/gocop-postava.exe ./cmd/gocop-postava

      - name: Licenca za instalacijski program (UTF-8 s BOM-om)
        shell: pwsh
        run: |
          $t = Get-Content LICENSE_hr.txt -Raw -Encoding UTF8
          [IO.File]::WriteAllText("build/licenca.txt", $t, (New-Object Text.UTF8Encoding $true))

      - name: Instalacijski program
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DVerzija=$env:IZDANJE" build\postava.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Proba s grane
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: postava-proba
          path: dist/

      - name: Nacrt izdanja
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist && sha256sum goCOP-postava-*.exe gocop-postava.exe > SHA256SUMS-postava && cat SHA256SUMS-postava
          gh release create "$GITHUB_REF_NAME" goCOP-postava-*.exe gocop-postava.exe SHA256SUMS-postava \
            --draft --title "goCOP Postava ${IZDANJE}" \
            --notes "Instalacijski program za Windows. Instalira Postavu, a ona preuzme najnovije potpisano izdanje goCOP-a. Upute: docs/INSTALACIJA.md."
